services:
  - type: web
    name: aljada-task-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && node prepare-mongo.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://aljada-task-desk.vercel.app
